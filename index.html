<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SCI CENTER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    (function() {
      var APP_VER = '20260728_v105';
      if (localStorage.getItem('sys_ver') !== APP_VER) {
        localStorage.setItem('sys_ver', APP_VER);
        sessionStorage.removeItem('ver_reloaded');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
        if (!sessionStorage.getItem('ver_reloaded')) {
          sessionStorage.setItem('ver_reloaded', 'true');
          window.location.reload(true);
        }
      }
    })();
    window.addEventListener('error', function(e) {
      if (e.message && (e.message.indexOf('Importing a module script failed') !== -1 || e.message.indexOf('Loading chunk') !== -1)) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        window.location.reload(true);
      }
    });
  </script>

  <!-- Custom Icons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- App appearance for home screen -->
  <meta name="apple-mobile-web-app-title" content="SCI CENTER">
  <meta name="application-name" content="SCI CENTER">
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4338ca">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    #root {
      transition: opacity 0.5s ease-in;
    }

    /* Prevent content jump before splash screen z-index takes over */
    body {
      margin: 0;
      background: #4338ca;
      /* Indigo-700 to match splash */
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
